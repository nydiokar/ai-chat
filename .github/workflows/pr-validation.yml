name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npm run prisma:generate

    - name: Check for dependency changes
      run: |
        if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '(package\.json|package-lock\.json)'; then
          echo "Dependencies changed, running full audit"
          npm audit --audit-level high
        else
          echo "No dependency changes detected"
        fi

    - name: Type check
      run: npm run build

    - name: Lint code
      run: npm run lint

    - name: Run CI tests
      run: npm run test:ci
      env:
        NODE_ENV: test

    - name: Check for security vulnerabilities
      run: |
        # Check for high/critical vulnerabilities
        if npm audit --audit-level high --json | jq -e '.vulnerabilities.high or .vulnerabilities.critical'; then
          echo "🚨 High or critical security vulnerabilities found!"
          echo "Please address these before merging."
          exit 1
        else
          echo "✅ No high/critical security vulnerabilities found"
        fi

    - name: PR Quality Analysis
      if: github.event_name == 'pull_request'
      run: |
        echo "🔍 Analyzing pull request quality..."

        PR_TITLE="${{ github.event.pull_request.title }}"
        PR_BODY="${{ github.event.pull_request.body }}"
        CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | wc -l)

        echo "📋 PR Analysis:"
        echo "   • Title: $PR_TITLE"
        echo "   • Files changed: $CHANGED_FILES"

        # Check PR title format
        if echo "$PR_TITLE" | grep -E "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .{1,}" >/dev/null; then
          echo "✅ PR title follows conventional commit format"
        else
          echo "💡 PR title suggestion (conventional commits):"
          echo "   Format: type(scope): description"
          echo "   Examples:"
          echo "     • feat: add user authentication"
          echo "     • fix: resolve memory leak in service"
          echo "     • docs: update API documentation"
          echo "     • refactor: simplify error handling"
        fi

        # Check PR description
        if [ ${#PR_BODY} -gt 10 ]; then
          echo "✅ PR has description"
        else
          echo "💡 Consider adding a description explaining the changes"
        fi

        # Analyze changed files
        if [ "$CHANGED_FILES" -gt 50 ]; then
          echo "⚠️  Large PR detected ($CHANGED_FILES files)"
          echo "💡 Consider breaking into smaller, focused PRs"
        elif [ "$CHANGED_FILES" -eq 1 ]; then
          echo "✅ Small, focused PR (1 file changed)"
        else
          echo "ℹ️  Medium PR ($CHANGED_FILES files)"
        fi

        # Check for test changes
        TEST_CHANGES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -c "\.test\.\|\.spec\.\|__tests__" || echo "0")
        if [ "$TEST_CHANGES" -gt 0 ]; then
          echo "✅ Includes test changes ($TEST_CHANGES test files)"
        else
          echo "💡 Consider adding tests for your changes"
        fi
